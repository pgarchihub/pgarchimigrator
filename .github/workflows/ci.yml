name: CI

# Runs on every push to main and every pull request — the same checks
# this project has been running manually throughout development (see
# README.md's "Setup" section), now automated so a regression like the
# ones found by hand in this codebase's history (a nil-vs-empty-slice bug,
# an in-memory/DB sync gap, a timezone-dependent test) gets caught on the
# very next push instead of waiting for someone to notice by hand.
on:
  push:
    branches: [main]
  pull_request:

# Cancels a still-running workflow for the same branch/PR when a new
# commit is pushed — otherwise every force-push or rapid-fire commit
# queues up its own full run, burning CI minutes on results nobody will
# read once a newer commit supersedes them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Baseline hardening: the default GITHUB_TOKEN is read-only unless a job
# explicitly needs more (none here do).
permissions:
  contents: read

jobs:
  # --- Backend: unit tests (no database required) ------------------------
  backend-unit:
    name: Backend / unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # go-version-file (not a hardcoded go-version) reads the exact
          # patch version from go.mod's own "go" directive — keeps this
          # workflow from silently drifting out of sync with it again
          # (see go.mod's own comment on why the patch level matters for
          # govulncheck specifically). actions/setup-go caches the
          # module + build cache keyed on go.sum by default — no extra
          # config needed.

      - name: gofmt check
        # gofmt -l lists files that are NOT correctly formatted; the repo
        # should never have any, so a non-empty listing fails the build.
        # This is the exact check used by hand throughout this project's
        # development (see the many "gofmt -e" mentions in commit
        # history) — codified here instead of relying on remembering to
        # run it.
        run: |
          UNFORMATTED="$(gofmt -l .)"
          if [ -n "$UNFORMATTED" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$UNFORMATTED"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: govulncheck (dependency vulnerability scan)
        # Cannot run in a sandboxed/offline dev environment (needs to
        # reach the Go vulnerability database) — this is precisely why it
        # belongs in CI rather than a local pre-commit step: every push
        # gets a real, current scan against actual internet access,
        # closing a gap a security self-audit could only flag, not verify.
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: go test (unit)
        run: go test ./... -v

  # --- Backend: integration tests (needs real PostgreSQL) -----------------
  # Runs the full integration suite against every PostgreSQL major version
  # this project claims to support (see README.md's "Supported PostgreSQL
  # Versions") — fail-fast: false so one version's failure doesn't hide
  # results from the others; each matrix entry is a genuinely independent
  # job (parallelized by GitHub Actions, not run sequentially), so this
  # doesn't multiply wall-clock time the way a naive loop would, though it
  # does multiply total CI minutes consumed by roughly the matrix size —
  # an accepted, deliberate cost for actually validating the claimed
  # range rather than just asserting it in a README.
  backend-integration:
    name: Backend / integration tests (PG ${{ matrix.postgres-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: [12, 13, 14, 15, 16, 17, 18]
    env:
      PGARCHIMIGRATOR_TEST_PG_VERSION: ${{ matrix.postgres-version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start test PostgreSQL instances (PG ${{ matrix.postgres-version }})
        # Reuses the exact same compose file used for local development
        # (see README.md) — deliberately not a hand-duplicated set of
        # GitHub Actions "services:" entries, which can't express the
        # wal_level=logical / wal_level=replica command-line flags these
        # tests specifically depend on without drifting out of sync with
        # the file developers actually run locally.
        # PGARCHIMIGRATOR_TEST_PG_VERSION (set above from the matrix) is
        # what selects the image version — see docker-compose.dev.yml's
        # own comment on this variable.
        run: docker compose -f deploy/docker-compose.dev.yml up -d

      - name: Wait for pg-logical and pg-upgrade-target to accept connections
        # pg-upgrade-target (deploy/docker-compose.dev.yml) is
        # internal/engines/postgresql/upgrade's own second, separate PostgreSQL instance —
        # its own integration tests need it just as much as pg-logical,
        # so it needs the same readiness gate pg-logical already had,
        # not just an implicit "docker compose up finished starting
        # containers" assumption (a container existing and PostgreSQL
        # inside it actually accepting connections are different
        # points in time).
        run: |
          for svc in pg-logical pg-upgrade-target; do
            ready=false
            for i in $(seq 1 30); do
              if docker compose -f deploy/docker-compose.dev.yml exec -T "$svc" pg_isready -U pgarchimigrator > /dev/null 2>&1; then
                echo "$svc is ready"
                ready=true
                break
              fi
              echo "waiting for $svc... ($i/30)"
              sleep 2
            done
            if [ "$ready" != true ]; then
              echo "$svc did not become ready in time" >&2
              docker compose -f deploy/docker-compose.dev.yml logs "$svc"
              exit 1
            fi
          done

      - name: go test (integration)
        # -p 1 forces packages to run ONE AT A TIME, not Go's default
        # cross-package parallelism — every integration test package
        # here shares ONE real PostgreSQL instance (the docker-compose
        # services brought up above), and several packages deliberately
        # create real locks/transactions as part of their own testing
        # (see e.g. internal/engines/postgresql/ddlflow's lock_timeout tests,
        # internal/engines/postgresql/shadowflow's swap tests). Without -p 1, Go runs those
        # packages CONCURRENTLY with internal/engines/postgresql/monitor's
        # TestCheckLockWait_NoLocks_ReturnsFalse — which asserts there
        # are NO pending locks anywhere in the database — a real,
        # confirmed flaky-CI-failure this exact combination caused: a
        # completely unrelated package's test happened to be holding a
        # lock at the same moment monitor's test ran its assertion. No
        # test file here uses t.Parallel() (tests within a single
        # package already ran sequentially before this fix), so -p 1
        # only removes the CROSS-package race, not any real intra-
        # package parallelism this project relies on.
        run: go test ./... -tags=integration -timeout 5m -v -p 1

      - name: Tear down test PostgreSQL instances
        if: always()
        run: docker compose -f deploy/docker-compose.dev.yml down -v

  # --- Frontend: tests + production build ---------------------------------
  frontend:
    name: Frontend / tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: npm audit (dependency vulnerability scan)
        # continue-on-error: npm audit can flag transitive dev-dependency
        # advisories with no real exploit path for this project (common,
        # noisy false-positive source) — surfaced in the CI log either
        # way, but shouldn't fail the whole pipeline over something that
        # needs a human to actually triage, not an automatic block.
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Vitest
        # vite.config.ts pins TZ=Europe/Istanbul for this exact reason —
        # a timezone-dependent bug in the date-range filter passed every
        # test on a UTC runner and only failed on a real Istanbul
        # machine. Pinning it means CI catches what a UTC-only runner
        # would silently miss, regardless of which timezone this
        # particular CI runner happens to be in.
        run: npm test

      - name: Production build (tsc -b + vite build)
        run: npm run build

  # --- Deployment artifacts: Docker image + Helm chart ---------------------
  deployment-checks:
    name: Deployment / Docker build + Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker build
        # Exercises the full multi-stage build, including the webbuild
        # stage (Node + npm ci + npm run build) that produces the SPA
        # embedded into the Go binary — catches a broken Dockerfile
        # before it reaches anyone trying to deploy from main.
        run: docker build -t pgarchimigrator:ci .

      - uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: helm lint
        run: helm lint deploy/helm/pgarchimigrator

      - name: helm template (sanity-check manifest rendering)
        run: helm template ci-check deploy/helm/pgarchimigrator > /dev/null

      - name: install.sh syntax check
        # Can't run this end to end in CI — it needs a real GitHub
        # Release to download from, which doesn't exist until this
        # project's first tag is actually pushed — so this is limited
        # to catching a syntax error before it reaches anyone piping
        # this script straight into their shell (see the script's own
        # header comment for the security reasoning behind everything
        # it actually does at runtime).
        run: sh -n scripts/install.sh

      - name: install.ps1 syntax check
        # GitHub's own ubuntu-latest runner ships PowerShell Core
        # (pwsh) preinstalled — Parser.ParseFile validates syntax
        # without executing anything, the PowerShell equivalent of
        # `sh -n` above.
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("scripts/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  # --- Playground: the Community demo -------------------------------------
  playground-smoke:
    name: Playground / real timing measurement + zero-downtime demo
    runs-on: ubuntu-latest
    # Real, measured verification that playground/docker-compose.yml
    # actually works end to end, and real measured timing (see this
    # job's own "Report real measured timing" / "Post real measured
    # timing..." steps below) — this sandbox this repo is developed in
    # has no docker daemon, so this job is the only place any of this
    # is verified for real rather than by careful reading alone (same
    # constraint and same commit-comment log-capture pattern already
    # established in pgarchimigrator-enterprise's own testenv-smoke
    # job).
    #
    # This demo was originally framed as "90 seconds" before it had
    # ever actually been run — the first real measurement (this job's
    # own commit-comment history) showed ~28s to bring the environment
    # up, then several minutes (not ~60s) for the migration itself on
    # 5M rows, on GitHub Actions' own standard 2-vCPU runner. Kept at
    # 5M rows deliberately (a smaller table would hide whether this
    # genuinely works at real data volume) with the timing claim
    # corrected to match, rather than shrinking the table to chase a
    # number decided before anything was measured.
    #
    # Measured to the SWAPPING phase completing — the actual zero-
    # downtime moment (orders.id genuinely becomes bigint, live) — not
    # to the job's own terminal COMPLETED state, which only arrives
    # after FR-08a's own 10-minute ROLLBACK_WINDOW safety period
    # (internal/engines/postgresql/shadowflow's own defaultRollbackWindow,
    # not configurable via any env var or flag — verified by reading
    # that package, not assumed). That 10-minute window is a real,
    # intentional safety feature, but it runs unattended in the
    # background and is not what a viewer watching this demo needs to
    # sit through to see the actual zero-downtime result.
    permissions:
      contents: write # needed for the failure-diagnostics commit-comment step below
    steps:
      - uses: actions/checkout@v4

      - name: docker compose up (timed)
        working-directory: playground
        run: |
          exec > >(tee /tmp/compose-up-output.txt) 2>&1
          START=$(date +%s)
          docker compose up -d --wait
          END=$(date +%s)
          echo "COMPOSE_UP_SECONDS=$((END - START))" >> "$GITHUB_ENV"
          echo "docker compose up -d --wait took $((END - START))s"

      - name: Verify the seed actually produced 5,000,000 rows
        working-directory: playground
        run: |
          exec > >(tee -a /tmp/playground-all-output.txt) 2>&1
          echo "--- Verify the seed actually produced 5,000,000 rows ---"
          COUNT=$(docker compose exec -T pg psql -U pgarchimigrator -d playground -tAc "SELECT count(*) FROM orders;")
          echo "orders row count: $COUNT"
          [ "$COUNT" = "5000000" ] || (echo "expected 5000000 rows, got $COUNT" && exit 1)

      - name: Log in as the auto-created admin
        run: |
          exec > >(tee -a /tmp/playground-all-output.txt) 2>&1
          echo "--- Log in as the auto-created admin ---"
          JAR=/tmp/playground-cookies.txt
          curl -s -c "$JAR" -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@example.com","password":"playground123"}' > /tmp/login-response.json
          cat /tmp/login-response.json
          grep -q '"email":"admin@example.com"' /tmp/login-response.json || (echo "login did not return the expected user" && exit 1)

      - name: "Start the zero-downtime ALTER COLUMN TYPE (id: integer -> bigint) and time it to SWAPPING completion"
        run: |
          exec > >(tee -a /tmp/playground-all-output.txt) 2>&1
          echo "--- Start the zero-downtime ALTER COLUMN TYPE ---"
          JAR=/tmp/playground-cookies.txt
          START=$(date +%s)

          RESPONSE=$(curl -s -c "$JAR" -b "$JAR" -X POST http://localhost:8080/api/migrations \
            -H "Content-Type: application/json" \
            -d '{"table":"orders","operation":"ALTER_COLUMN_TYPE","column":"id","type":"bigint","actor":"playground-ci"}')
          echo "start response: $RESPONSE"
          # 'JobID' (capital, matching progress.Report's own Go field
          # name — the start-migration response is that same struct,
          # confirmed via this repo's real CI: the actual response
          # body was 'JobID':'job-...', not 'id') — a first guess at
          # 'id' here was wrong and never would have worked.
          JOB_ID=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['JobID'])" 2>/dev/null || echo "")
          if [ -z "$JOB_ID" ]; then
            echo "could not extract a job id from the start-migration response"
            exit 1
          fi
          echo "job id: $JOB_ID"

          # Poll until CurrentPhase moves past SWAPPING (into
          # ROLLBACK_WINDOW, or straight to COMPLETED/FAILED/ABORTED if
          # this build's own timing makes the window race by) — see
          # this job's own top-level comment for why SWAPPING, not
          # COMPLETED, is the right thing to measure against.
          PHASE=""
          for i in $(seq 1 120); do
            REPORT=$(curl -s -c "$JAR" -b "$JAR" "http://localhost:8080/api/migrations/$JOB_ID")
            PHASE=$(echo "$REPORT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('CurrentPhase',''))" 2>/dev/null || echo "")
            echo "  [$i] phase: $PHASE"
            case "$PHASE" in
              ROLLBACK_WINDOW|COMPLETED)
                break
                ;;
              FAILED|ABORTED)
                echo "migration ended in $PHASE — full report:"
                echo "$REPORT"
                exit 1
                ;;
            esac
            sleep 1
          done

          END=$(date +%s)
          echo "MIGRATION_SECONDS=$((END - START))" >> "$GITHUB_ENV"
          echo "reached phase $PHASE after $((END - START))s"

          case "$PHASE" in
            ROLLBACK_WINDOW|COMPLETED) ;;
            *)
              echo "never reached ROLLBACK_WINDOW or COMPLETED within the poll budget (last phase: $PHASE)"
              exit 1
              ;;
          esac

      - name: Verify the column type actually changed
        working-directory: playground
        run: |
          exec > >(tee -a /tmp/playground-all-output.txt) 2>&1
          echo "--- Verify the column type actually changed ---"
          TYPE=$(docker compose exec -T pg psql -U pgarchimigrator -d playground -tAc "SELECT data_type FROM information_schema.columns WHERE table_name = 'orders' AND column_name = 'id';")
          echo "orders.id data_type: $TYPE"
          echo "$TYPE" | grep -qi "bigint" || (echo "orders.id is not bigint after the migration" && exit 1)

      - name: Report real measured timing
        run: |
          TOTAL=$((COMPOSE_UP_SECONDS + MIGRATION_SECONDS))
          echo "### Playground real measured timing" >> "$GITHUB_STEP_SUMMARY"
          echo "- docker compose up (incl. 5M-row seed): ${COMPOSE_UP_SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- login + start migration + reach zero-downtime swap: ${MIGRATION_SECONDS}s" >> "$GITHUB_STEP_SUMMARY"
          echo "- total: ${TOTAL}s" >> "$GITHUB_STEP_SUMMARY"
          echo "TIMING_TOTAL_SECONDS=$TOTAL" >> "$GITHUB_ENV"

      - name: Post real measured timing as a commit comment (always, not just on failure)
        # $GITHUB_STEP_SUMMARY above is only ever visible in the
        # Actions web UI — no REST API exposes it, so (same constraint
        # as this job's own step logs, documented elsewhere in this
        # workflow) it's unreachable from this repo's own development
        # sandbox. Posting the same numbers here, through the one
        # channel (commit comments via api.github.com) that sandbox
        # CAN reach, makes real measured timing checkable later by
        # anyone, not just visible once in the UI at run time.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${COMPOSE_UP_SECONDS:-}" ] && [ -n "${MIGRATION_SECONDS:-}" ]; then
            {
              echo "## Playground real measured timing"
              echo ""
              echo "- docker compose up (incl. 5M-row seed): ${COMPOSE_UP_SECONDS}s"
              echo "- login + start migration + reach zero-downtime swap: ${MIGRATION_SECONDS}s"
              echo "- **total: ${TIMING_TOTAL_SECONDS}s**"
            } > /tmp/timing-body.txt
          else
            printf '## Playground real measured timing\n\nNot available — this run did not reach both timed steps.\n' > /tmp/timing-body.txt
          fi
          python3 -c "import json; json.dump({'body': open('/tmp/timing-body.txt').read()}, open('/tmp/timing-comment.json', 'w'))"
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/timing-comment.json

      - name: Dump logs and post as a commit comment on failure
        if: failure()
        working-directory: playground
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            # NOT docker's own image-pull progress (/tmp/compose-up-output.txt)
            # or every service's logs — both were pushing the real,
            # useful output (this step's own psql/curl results, below)
            # out of the 60KB trim budget entirely on the previous
            # real run of this job. Just pg's own log (includes
            # postgres's own initdb.d script output — the actual
            # INSERT result/error this failure needs) and bootstrap's.
            echo "=== docker compose logs (pg, bootstrap only) ==="
            docker compose logs pg bootstrap 2>&1
            echo ""
            # Deliberately LAST — tail -c 60000 below keeps a file's
            # own tail end over its start when the combined output
            # exceeds the trim budget, and this is the output most
            # worth keeping if something has to give (the seed
            # verification, login, and migration steps' own output —
            # docker's own image-pull progress above is comparatively
            # uninteresting once something here has actually failed).
            echo "=== seed verification / login / migration steps' own output (if they ran) ==="
            cat /tmp/playground-all-output.txt 2>/dev/null || echo "(no playground-all-output file)"
          } > /tmp/playground-logs.txt
          tail -c 60000 /tmp/playground-logs.txt > /tmp/playground-logs-trimmed.txt
          python3 -c "import json; logs = open('/tmp/playground-logs-trimmed.txt').read(); json.dump({'body': '## playground-smoke failure logs\n\n' + chr(96)*3 + '\n' + logs + '\n' + chr(96)*3}, open('/tmp/playground-comment.json', 'w'))"
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/playground-comment.json

      - name: Tear down
        if: always()
        working-directory: playground
        run: docker compose down -v

  # --- Benchmark: real, measured cmd/loadtest output for README.md -------
  benchmark:
    name: Benchmark / real cmd/loadtest measurement
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed for the commit-comment steps below
    # Real, measured p50/p95/p99 application-query latency before,
    # during, and after a real EXPAND_BACKFILL migration against a real
    # 5,000,000-row table — this repo's own README.md's "Benchmark"
    # section quotes this job's own real output, not invented numbers.
    # cmd/loadtest is this repo's own existing tool for exactly this
    # (talks to the real REST API like any external client — see its
    # own doc comment in cmd/loadtest/main.go), not something built new
    # for this job.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start test PostgreSQL (pg-logical)
        run: docker compose -f deploy/docker-compose.dev.yml up -d pg-logical

      - name: Wait for pg-logical to accept connections
        run: |
          for i in $(seq 1 30); do
            if docker compose -f deploy/docker-compose.dev.yml exec -T pg-logical pg_isready -U pgarchimigrator > /dev/null 2>&1; then
              echo "pg-logical ready"
              exit 0
            fi
            sleep 1
          done
          echo "pg-logical never became ready"
          exit 1

      - name: Bootstrap admin + start the server
        env:
          PGARCHIMIGRATOR_DATABASE_URL: "postgresql://pgarchimigrator:pgarchimigrator_dev_only@localhost:55432/pgarchimigrator_test?sslmode=disable"
        run: |
          go run ./cmd/pgarchimigrator auth create-admin --email admin@example.com --password benchmark-only-password
          nohup go run ./cmd/pgarchimigrator serve > /tmp/server-output.txt 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/api/setup-required > /dev/null 2>&1; then
              echo "server ready"
              exit 0
            fi
            sleep 1
          done
          echo "server never became ready"
          cat /tmp/server-output.txt
          exit 1

      - name: Generate the benchmark table (5,000,000 rows — same scale as playground/)
        run: |
          exec > >(tee /tmp/benchmark-generate-output.txt) 2>&1
          go run ./cmd/loadtest generate \
            --dsn "postgresql://pgarchimigrator:pgarchimigrator_dev_only@localhost:55432/pgarchimigrator_test?sslmode=disable" \
            --rows 5000000

      - name: Run the real benchmark (ADD_COLUMN with a volatile default — exercises EXPAND_BACKFILL, not the metadata-only fast path)
        run: |
          exec > >(tee /tmp/benchmark-run-output.txt) 2>&1
          go run ./cmd/loadtest run \
            --dsn "postgresql://pgarchimigrator:pgarchimigrator_dev_only@localhost:55432/pgarchimigrator_test?sslmode=disable" \
            --api-url "http://localhost:8080" \
            --admin-email admin@example.com --admin-password benchmark-only-password \
            --operation ADD_COLUMN --column loadtest_created_ts --column-type timestamptz \
            --default "now()" --volatile-default

      - name: Post real benchmark output as a commit comment (always)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "=== loadtest generate output ==="
            cat /tmp/benchmark-generate-output.txt 2>/dev/null || echo "(not available)"
            echo ""
            echo "=== loadtest run output (the real benchmark) ==="
            cat /tmp/benchmark-run-output.txt 2>/dev/null || echo "(not available)"
          } > /tmp/benchmark-combined.txt
          tail -c 60000 /tmp/benchmark-combined.txt > /tmp/benchmark-trimmed.txt
          python3 -c "import json; logs = open('/tmp/benchmark-trimmed.txt').read(); json.dump({'body': '## Real cmd/loadtest benchmark output\n\n' + chr(96)*3 + '\n' + logs + '\n' + chr(96)*3}, open('/tmp/benchmark-comment.json', 'w'))"
          curl -s -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d @/tmp/benchmark-comment.json

      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.dev.yml down -v
