name: Migration Apply

# Runs "apply-file" (see docs/migration-as-code.md) against a REAL
# database — unlike Migration Preview (migration-preview.yml), which
# only ever reads. This workflow can genuinely change your schema, so
# it is deliberately NOT triggered automatically by a push or a PR
# merge — see the "on:" block below. A human has to open the Actions
# tab, pick this workflow, and click "Run workflow" every single time,
# and then type the literal word APPLY into the confirmation input
# before anything touches the real database. There is no path from a
# git push alone to a real schema change here.
#
# What this does, in order:
#   1. Runs preview-file first, as a sanity check — the exact SQL,
#      chosen strategy, and any warnings for every migration in the
#      target directory, visible in the run's own log before anything
#      real happens.
#   2. Only if that succeeds AND the confirmation input is exactly
#      "APPLY", runs apply-file for real.
#   3. Uploads the full output as a downloadable artifact (kept for
#      90 days — see the upload step below to change that), so "what
#      exactly happened three months ago" stays answerable after the
#      workflow run's own log eventually ages out.
#   4. Writes a summary to the run's own Job Summary — which migrations
#      ran, which were already applied and skipped, and (only if this
#      run failed partway through) the JOB IDs of everything that
#      already completed before the failure, ready to paste into
#      `pgarchimigrator rollback <job-id>` if a human decides that's
#      the right call. apply-file itself never does this automatically
#      — see the summary step's own comment for why.
#   5. Optionally posts a Slack notification, if you've configured a
#      webhook secret for it (entirely optional — skipped cleanly if
#      you haven't).
#
# Note for adopters: this workflow assumes YOUR repository keeps its
# own migration files under migrations/ at the repo root (see
# docs/migration-as-code.md's "Directory convention"). You must
# configure a PGARCHIMIGRATOR_DATABASE_URL secret yourself for each
# GitHub Environment you intend to use (see the "environment" input
# below) — this repository cannot provide one for you. Scoping it to an
# Environment (Settings > Environments) rather than a plain repo secret
# is what lets staging and production hold different database URLs
# under the same secret name, and lets you layer on required reviewers
# or a wait timer later, entirely from repo settings, with no change
# needed to this file.

on:
  workflow_dispatch:
    inputs:
      directory:
        description: "Directory of migration JSON files to apply"
        required: true
        default: "migrations"
      environment:
        description: "Which GitHub Environment to run against (each holds its own PGARCHIMIGRATOR_DATABASE_URL)"
        required: true
        type: choice
        options:
          - staging
          - production
        default: production
      timeout_minutes:
        description: "Job timeout in minutes — a large SHADOW_TABLE migration (ALTER_COLUMN_TYPE, PARTITION_TABLE) on a huge table can genuinely take hours; raise this for those"
        required: true
        default: "240"
      confirm:
        description: 'Type APPLY (exactly, all caps) to confirm — this runs against a real database'
        required: true

permissions:
  contents: read

concurrency:
  # Only one apply run at a time, full stop — two concurrent apply-file
  # runs against the same database is exactly the kind of thing that
  # should never happen, migration ordering guarantees aside.
  group: migration-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Apply migrations
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    timeout-minutes: ${{ fromJSON(inputs.timeout_minutes) }}
    env:
      # Configure this secret yourself, per Environment — see the note
      # above. Never defaulted or falls back to a local/ephemeral
      # database the way Migration Preview's does; an unset secret here
      # should fail loudly, not silently point at nothing.
      PGARCHIMIGRATOR_DATABASE_URL: ${{ secrets.PGARCHIMIGRATOR_DATABASE_URL }}
    steps:
      - name: Verify the confirmation input
        if: inputs.confirm != 'APPLY'
        run: |
          echo "::error::Confirmation input must be exactly 'APPLY' (got '${{ inputs.confirm }}') — stopping before touching anything."
          exit 1

      - name: Verify the database secret is configured
        run: |
          if [ -z "$PGARCHIMIGRATOR_DATABASE_URL" ]; then
            echo "::error::PGARCHIMIGRATOR_DATABASE_URL is not set for the '${{ inputs.environment }}' environment — configure it under Settings > Environments > ${{ inputs.environment }} before running this workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the CLI
        run: go build -o pgarchimigrator-cli ./cmd/pgarchimigrator

      - name: Preview first, as a sanity check
        run: |
          ./pgarchimigrator-cli preview-file \
            --dir "${{ inputs.directory }}" \
            --state-db /tmp/pgam-apply-state.db

      - name: Apply
        id: apply
        run: |
          OUTPUT_FILE=/tmp/pgam-apply-output.txt
          if ! ./pgarchimigrator-cli apply-file \
              --dir "${{ inputs.directory }}" \
              --state-db /tmp/pgam-apply-state.db \
              > "$OUTPUT_FILE" 2>&1; then
            cat "$OUTPUT_FILE"
            echo "failed=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          cat "$OUTPUT_FILE"

      - name: Upload output as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-apply-output-${{ github.run_id }}
          path: /tmp/pgam-apply-output.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Write the job summary
        if: always()
        run: |
          {
            echo "### Migration Apply — \`${{ inputs.directory }}\` (${{ inputs.environment }})"
            echo ""
            if [ "${{ steps.apply.outputs.failed }}" = "true" ]; then
              echo "**Failed** — see the \"Apply\" step's log above for exactly which migration and why."
              echo ""
              echo "apply-file deliberately stops at the first failure rather than continuing past it (real ordering dependencies between migration files are common) — any migrations listed above it in the log already completed and are **not automatically rolled back**. See docs/migration-as-code.md for why: application code may already depend on a completed migration by the time a later one in the same batch fails."
              echo ""
              COMPLETED_JOBS=$(grep -oE '^Job [A-Za-z0-9_-]+' /tmp/pgam-apply-output.txt 2>/dev/null | awk '{print $2}')
              if [ -n "$COMPLETED_JOBS" ]; then
                echo "**Jobs that completed before the failure** (for manual review — roll back individually with \`pgarchimigrator rollback <job-id>\` only if you decide that's the right call, keeping in mind some operations refuse to roll back once COMPLETED):"
                echo ""
                echo "$COMPLETED_JOBS" | while read -r jid; do echo "- \`$jid\`"; done
                echo ""
              fi
            else
              echo "**Succeeded.**"
            fi
            echo ""
            echo "Full output uploaded as artifact \`migration-apply-output-${{ github.run_id }}\` (90-day retention)."
            echo ""
            echo "\`\`\`"
            cat /tmp/pgam-apply-output.txt 2>/dev/null || echo "(no output captured)"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Slack
        # Entirely optional — this step does nothing if you haven't
        # configured a SLACK_WEBHOOK_URL secret. Plain curl against an
        # incoming webhook rather than a third-party Slack action —
        # same "avoid an extra supply-chain dependency for something
        # one auditable shell command already does" reasoning as
        # migration-preview.yml's own comment on git diff vs. a
        # changed-files action.
        if: always() && env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ steps.apply.outputs.failed }}" = "true" ]; then
            STATUS_TEXT="❌ failed"
          else
            STATUS_TEXT="✅ succeeded"
          fi
          curl -sf -X POST -H 'Content-Type: application/json' \
            -d "{\"text\": \"Migration Apply (${{ inputs.environment }}, \`${{ inputs.directory }}\`) ${STATUS_TEXT} — run by ${{ github.actor }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK_URL" \
            || echo "::warning::Slack notification failed to send — the migration result itself is unaffected, see the job summary above."
