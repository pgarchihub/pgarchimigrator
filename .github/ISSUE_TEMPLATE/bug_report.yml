name: Bug report
description: Something didn't work the way it should have.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. If this involves a
        possible **security vulnerability** (e.g. anything that lets
        untrusted input reach raw SQL), please use [private
        reporting](https://github.com/pgarchihub/pgarchimigrator/security)
        instead — see [SECURITY.md](../../SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug — what you expected, and what actually happened instead.
      placeholder: "I ran an ADD_INDEX migration on a large table, and..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: As specific as you can — the operation, table shape, and any relevant flags/config.
      placeholder: |
        1. `pgarchimigrator migrate --table orders --operation ADD_INDEX --column status`
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: pgArchiMigrator version
      description: "From the header's version badge, or `pgarchimigrator version`."
      placeholder: v2.0.0
    validations:
      required: true

  - type: input
    id: pg-version
    attributes:
      label: PostgreSQL version
      placeholder: "PostgreSQL 16.4"
    validations:
      required: true

  - type: dropdown
    id: strategy
    attributes:
      label: Migration strategy (if known)
      description: Shown on the migration's detail page, or in the preview response.
      options:
        - "Not sure / not applicable"
        - DIRECT_DDL
        - EXPAND_BACKFILL
        - SHADOW_TABLE
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      description: |
        Server logs, the job's `LastError` field, or CI output if this
        showed up in `preview-file`/CI. Please redact connection
        strings, passwords, or anything else sensitive first.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Table size, concurrent write load, anything unusual about the environment.
    validations:
      required: false
