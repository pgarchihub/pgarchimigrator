{{- /*
Only rendered when the user did NOT supply an existingSecret — i.e. they
used database.inlineDSN for quick/throwaway testing. Production
deployments should always use database.existingSecret instead, created
out-of-band via `kubectl create secret`, so the real DSN never has to
appear in a values file, Helm release history, or `helm get values` output.
*/}}
{{- if not .Values.database.existingSecret.name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pgarchimigrator.fullname" . }}-db
  labels:
    {{- include "pgarchimigrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.database.inlineDSN | quote }}
{{- end }}
